<!DOCTYPE html>
<html lang="pt-br">
<head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vallet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="{% static 'login.css' %}" />
    <link rel="icon" type="image/png" href="{% static 'assets/VALLET (2).png' %}" />
</head>
<body>
    <!-- HEADER (Mantendo identidade visual partilhada) -->
    <header class="header">
        <div class="container header-container">
            <a href="{% url 'appHome' %}" class="logo-link">
                <img src="{% static 'assets/VALLET_logo.png' %}" alt="Vallet Logo" class="logo">
            </a>
            <input type="checkbox" id="menu-toggle" class="menu-toggle">
            <label for="menu-toggle" class="menu-icon"><i class="bi bi-list"></i></label>
            <nav class="nav-links">
                <a href="{% url 'appHome' %}">Início</a>
                <a href="{% url 'appHome' %}#como-funciona">Como funciona</a>
                <a href="{% url 'appHome' %}#beneficios">Benefícios</a>
                <a href="{% url 'appHome' %}#contato">Contato</a>
            </nav>
        </div>
    </header>

    <main class="login-wrapper">
        <div class="container">
            <div class="back-nav">
                <a href="{% url 'appHome' %}" class="back-link">
                    <i class="bi bi-arrow-left"></i> Voltar à página inicial
                </a>
            </div>

            <div class="login-card">
                <!-- COLUNA FORMULÁRIO -->
                <div class="login-form-col">
                    <h1>Login</h1>

                    <form id="loginForm">
                        <div class="input-group">
                            <i class="bi bi-envelope"></i>
                            <input type="email" id="email" placeholder="Email" required />
                        </div>
                        <div class="input-group">
                            <i class="bi bi-key"></i>
                            <input type="text" id="accessCode" placeholder="Código de Acesso" required />
                        </div>
                        <div class="input-group">
                            <i class="bi bi-lock"></i>
                            <input type="password" id="password" placeholder="Senha" required />
                        </div>

                        <div class="forgot-password">
                            <a href="#">Esqueceu sua senha?</a>
                        </div>

                        <button type="submit" class="btn-submit">Entrar</button>
                    </form>

                    <div class="login-footer">
                        <hr class="separator">
                        <p>Ainda não tem acesso?</p>
                        <a href="{% url 'appHome' %}#contato" class="contact-link">Entre em contato conosco</a>
                    </div>
                </div>

                <!-- COLUNA IMAGEM -->
                <div class="login-image-col">
                    <img src="{% static 'assets/vallet_login.svg' %}" class="person-image" alt="Acesso Seguro" />
                </div>
            </div>

            <div class="page-footer">
                <p>© Vallet. Todos os direitos reservados.</p>
            </div>
        </div>
    </main>

    <!-- AUTENTICAÇÃO (Preservada integralmente) -->
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const accessCode = document.getElementById("accessCode").value;

          try {
            const resp = await fetch("/auth/firebase/", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                email: email,
                password: password,
                codigo_acesso: accessCode,
                access_code: accessCode,
              }),
            });

            const j = await resp.json();

            if (resp.ok) {
              const redirect = j.redirect;
              if (redirect) {
                window.location.href = redirect;
              } else {
                console.error(
                  "Redirecionamento não especificado. Usando fallback...",
                );
                window.location.href = "/gestor/";
              }
            } else {
              alert("Erro no login: " + (j.error || "Erro desconhecido"));
            }
          } catch (err) {
            alert("Erro de rede: " + err);
          }
        });
    </script>
</body>
</html>
