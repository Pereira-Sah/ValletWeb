{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acesso do gestor — Vallet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'login.css' %}?v=parking-3">
    <link rel="stylesheet" href="{% static 'public-dialogs.css' %}?v=parking-1">
    <link rel="icon" href="{% static 'assets/vallet_icon.png' %}" type="image/png">
    <script src="{% static 'public.js' %}?v=parking-1" defer></script>
    <script src="{% static 'login.js' %}?v=parking-1" defer></script>
</head>
<body class="login-page">
    <div class="login-layout">
        <div class="login-side">
            <header class="login-header"><a href="{% url 'appHome' %}#inicio" class="brand" aria-label="Vallet — página inicial"><img src="{% static 'assets/logo_versao3.png' %}" alt="Vallet" width="2048" height="756"></a></header>
            <main class="login-content">
                <a href="{% url 'appHome' %}#inicio" class="back-link"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18"/></svg>Voltar à página inicial</a>
                <h1>Acesso do gestor</h1>
                <form id="loginForm" method="post" action="{% url 'firebase_login' %}">
                    {% csrf_token %}
                    <div class="login-field"><label for="email">E-mail</label><input type="email" id="email" name="email" autocomplete="username" required></div>
                    <div class="login-field"><label for="password">Senha</label><div class="password-field">
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                        <button type="button" id="toggle-password" aria-label="Mostrar senha" aria-controls="password" aria-pressed="false">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg>
                        </button>
                    </div></div>
                    <div class="forgot-password"><button type="button" data-open-password aria-haspopup="dialog" aria-controls="recuperar-senha-modal">Esqueceu sua senha?</button></div>
                    <p id="login-feedback" class="login-feedback" role="alert" aria-live="assertive" hidden></p>
                    <button type="submit" class="btn-submit">Entrar</button>
                </form>
                <div class="login-footer"><p>Ainda não tem acesso?</p><button type="button" class="contact-link" data-open-contact aria-haspopup="dialog" aria-controls="contato-modal">Entre em contato conosco</button></div>
            </main>
        </div>
        <div class="login-art parking-art" aria-hidden="true">
            <img src="{% static 'assets/parking-gate.png' %}" alt="" width="1254" height="1254" loading="lazy" decoding="async">
        </div>
    </div>
    {% include 'partials/_public_dialogs.html' with with_password=True %}
</body>
</html>
